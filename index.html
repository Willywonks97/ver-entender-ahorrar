<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Hucha</title>
<meta name="theme-color" content="#07080F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Hucha">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Una app, tres apartados. Cada apartado es su herramienta completa; esta capa solo cambia entre ellos. */
:root{--bg:#07080F;--bar:#0B0D1A;--line:#252C4D;--ink:#E8F4FF;--muted:#8792B5;--cyan:#16F2E5;--h:52px;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){--bg:#07080F}}
:root[data-theme="dark"]{--bg:#07080F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
.top{position:fixed;left:0;right:0;top:0;z-index:5;height:calc(var(--h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.top button{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);
  font:700 .78rem "Chakra Petch",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button[aria-current="page"]{color:#04131A;background:var(--cyan);border-color:var(--cyan)}
.top button:focus-visible{outline:2px solid #FF2BD6;outline-offset:2px}
iframe{position:fixed;left:0;right:0;bottom:0;top:calc(var(--h) + env(safe-area-inset-top,0px));width:100%;height:calc(100% - var(--h) - env(safe-area-inset-top,0px));border:0;background:var(--bg)}
iframe[hidden]{display:none}
</style>
</head>
<body>
<nav class="top" aria-label="Apartados">
  <button type="button" data-s="hucha">Mi Hucha</button>
  <button type="button" data-s="ahorros">Ahorros</button>
  <button type="button" data-s="subs">Suscripciones</button>
</nav>
<iframe id="f-hucha" title="Mi Hucha" data-src="hucha.html" hidden></iframe>
<iframe id="f-ahorros" title="Ahorros" data-src="ahorros.html" hidden></iframe>
<iframe id="f-subs" title="Suscripciones" data-src="subs.html" hidden></iframe>
<script>
(function(){
  const S=["hucha","ahorros","subs"];
  const load=s=>{const f=document.getElementById("f-"+s);if(!f.src)f.src=f.dataset.src;return f};
  function go(s){
    if(!S.includes(s))s="hucha";
    S.forEach(x=>{const f=document.getElementById("f-"+x);f.hidden=x!==s;document.querySelector('[data-s="'+x+'"]').setAttribute("aria-current",x===s?"page":"false")});
    load(s);
    try{localStorage.setItem("finanzas-apartado",s)}catch(e){}
  }
  document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.s)));
  load("hucha"); // Suscripciones lee los gastos fijos de Mi Hucha: se carga siempre
  let start="hucha";try{start=localStorage.getItem("finanzas-apartado")||"hucha"}catch(e){}
  go(start);
  if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
