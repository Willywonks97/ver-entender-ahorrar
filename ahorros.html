/* Sin Claude: tus cuentas se guardan en este dispositivo; las ofertas del mercado se leen de ofertas.json (sin datos personales) */
(function(){
const LS="mis-ahorros-v1";
const KEY={entidades:"entidad_id",productos:"producto_id",condiciones:"condicion_id",subastas_letras:"subasta_id",emisiones_deuda:"observacion_id",precios:"precio_id",revisiones:"revision_id",cambios:"cambio_id"};
let local={};try{local=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){}
let market={};const subs={};
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(local))}catch(e){throw {code:"quota_exceeded",message:"No hay espacio en este dispositivo"}}};
function docsOf(c){const m={};(market[c]||[]).forEach(x=>{const id=x[KEY[c]];if(id)m[id]=x});Object.assign(m,local[c]||{});Object.keys(local["_del_"+c]||{}).forEach(id=>delete m[id]);
  return Object.keys(m).sort().map(id=>({id,exists:true,data:()=>m[id]}))}
const fire=c=>(subs[c]||[]).forEach(f=>f({docs:docsOf(c)}));
const ready=fetch("ofertas.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{market=(j&&j.datos)||{}}).catch(()=>{});
const db={collection:c=>({
  onSnapshot:(ok)=>{(subs[c]=subs[c]||[]).push(ok);ready.then(()=>ok({docs:docsOf(c)}));return()=>{subs[c]=(subs[c]||[]).filter(f=>f!==ok)}},
  doc:id=>({set:async b=>{(local[c]=local[c]||{})[id]=JSON.parse(JSON.stringify(b));if(local["_del_"+c])delete local["_del_"+c][id];persist();fire(c)},
            delete:async()=>{if(local[c])delete local[c][id];(local["_del_"+c]=local["_del_"+c]||{})[id]=1;persist();fire(c)}})})};
const downloads={save:async({filename,data})=>{const x=document.createElement("a");x.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));x.download=filename;document.body.appendChild(x);x.click();setTimeout(()=>{URL.revokeObjectURL(x.href);x.remove()},1500)}};
window.claude={use:async n=>n==="db"?db:n==="downloads"?downloads:null};
})();
</script>

/* ===== MOTOR DE CÁLCULO =====
   Intereses mensuales sobre el saldo, con el 19 % de retención descontado al abonarlos. */
function proyeccion(inicial,mensual,tae,meses,tope,simple){
  const r=tae/100/12, out=[]; let saldo=n(inicial), aportado=n(inicial), bruto=0, neto=0;
  for(let m=1;m<=Math.max(0,Math.round(meses));m++){
    const refer=simple?aportado:saldo;
    const base=tope?Math.min(refer,n(tope)):refer;
    const ib=base*r, inet=ib*(1-RET);
    bruto+=ib; neto+=inet;
    if(simple){aportado+=n(mensual); saldo=aportado+neto}
    else{saldo+=inet+n(mensual); aportado+=n(mensual)}
    out.push({mes:m,aportado,bruto,neto,saldo});
  }
  return out;
}
function resumenProy(p){
  if(!p.length) return {aportado:0,bruto:0,neto:0,saldo:0,imp:0};
  const u=p[p.length-1];
  return {aportado:u.aportado,bruto:u.bruto,neto:u.neto,saldo:u.saldo,imp:u.bruto-u.neto};
}
/* Línea de ganancia neta acumulada: escala a su propio máximo, así se ve crecer aunque sean céntimos.
   pasados = meses ya transcurridos (línea sólida); el resto va discontinuo. null = todo previsión. */
function chartLinea(p,pasados,iniISO,id){
  if(!p.length) return '<div class="empty">Pon los datos y verás aquí cómo crece.</div>';
  const W=640,H=200,L=58,R=14,T=16,B=26;
  const max=Math.max(...p.map(d=>d.neto))||1;
  const ex=(W-L-R)/p.length, X=i=>L+ex*(i+0.5), Y=v=>T+(H-T-B)*(1-v/max);
  const lab=v=>max<10?nf.format(v):max<2000?new Intl.NumberFormat('es-ES',{maximumFractionDigits:1}).format(v):nf0.format(v);
  let g='';
  [0,max/2,max].forEach(t=>{g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${L-7}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${lab(t)}</text>`});
  const pts=p.map((d,i)=>[X(i),Y(d.neto)]);
  const corte=pasados==null?p.length:Math.max(0,Math.min(p.length,pasados));
  const path=a=>a.map((q,k)=>(k?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const sol=pts.slice(0,corte), fut=pts.slice(Math.max(0,corte-1));
  const area=sol.length>1?`<path class="ar" d="${path(sol)} L ${sol[sol.length-1][0].toFixed(1)} ${Y(0).toFixed(1)} L ${sol[0][0].toFixed(1)} ${Y(0).toFixed(1)} Z"/>`:'';
  const lineas=(sol.length>1?`<path class="ln" d="${path(sol)}"/>`:'')+(fut.length>1?`<path class="lnf" d="${path(fut)}"/>`:'');
  const punto=corte>0&&corte<=pts.length?`<circle class="pt" cx="${pts[corte-1][0].toFixed(1)}" cy="${pts[corte-1][1].toFixed(1)}" r="4"/>`:'';
  const cada=Math.max(1,Math.ceil(p.length/7));
  let ejes='',hits='';
  p.forEach((d,i)=>{
    if(i===0||(i+1)%cada===0) ejes+=`<text x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle">${fmes(iniISO,i)}</text>`;
    hits+=`<g class="bar" data-i="${i}"><rect class="hit" x="${(L+ex*i).toFixed(1)}" y="${T}" width="${ex.toFixed(1)}" height="${(H-T-B).toFixed(1)}"/></g>`;
  });
  const hx=corte>0&&corte<p.length?X(corte-1):null;
  const marca=hx!=null?`<line class="hoy" x1="${hx.toFixed(1)}" x2="${hx.toFixed(1)}" y1="${T}" y2="${(H-B).toFixed(1)}"/><text class="hoyT" x="${(hx+5).toFixed(1)}" y="${T+9}">hoy</text>`:'';
  return `<svg class="chart" id="chart-${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ganancia neta acumulada mes a mes">${g}${area}${lineas}${marca}${punto}${ejes}${hits}</svg>
  <div class="leg"><span><i style="background:var(--accent)"></i>Ganancia neta acumulada (€)</span>${pasados==null?'':'<span>lo discontinuo es la previsión</span>'}</div>`;
}

const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PROY={};
function addMeses(iso,k){const d=new Date(iso);d.setMonth(d.getMonth()+k);return d.toISOString().slice(0,10)}
function mesesEntre(a,b){if(!a||!b)return 0;const A=new Date(a),B=new Date(b);return Math.max(0,(B.getFullYear()-A.getFullYear())*12+(B.getMonth()-A.getMonth()))}
function fmes(iso,k){const d=new Date(iso);d.setMonth(d.getMonth()+k+1);return MESES[d.getMonth()]+' '+String(d.getFullYear()).slice(2)}
function progRead(p,i,iniISO){
  const x=p[Math.max(0,Math.min(i,p.length-1))]||p[0];
  return `<span>Mes <b>${x.mes}</b> · ${fmes(iniISO,x.mes-1)}</span><span>tu dinero <b>${eur(x.aportado)}</b></span><span>ganado neto <b>${eur(x.neto)}</b></span><span>saldo <b>${eur(x.saldo)}</b></span>`;
}

  }).filter(Boolean).sort((a,b)=>b.tae-a.tae);
}

  const reqs=Object.keys(REQ).filter(k=>c[k]==='sí').map(k=>`<span class="pill">${REQ[k]}</span>`).join('')||(dep?'':'<span class="pill verif">sin requisitos</span>');
  const ver=c.estado_verificacion==='verificado'?'<span class="pill verif">comprobado</span>'
    :c.estado_verificacion==='discrepancia'?'<span class="pill disc">datos que no cuadran</span>':'<span class="pill pend">sin comprobar</span>';
  const meta=(dep?[c.plazo_meses?c.plazo_meses+' meses':null,c.saldo_min?'desde '+eur(c.saldo_min):null,
      c.liquidez==='sin_cancelacion'?'no se puede sacar antes':c.liquidez==='cancelacion_con_penalizacion'?'sacarlo antes tiene penalización':null,e.fondo_garantia]
    :[c.duracion_meses?'durante '+c.duracion_meses+' meses':'sin promoción',
      c.saldo_max_remunerado?'hasta '+eur(c.saldo_max_remunerado):'sin límite de saldo',e.fondo_garantia]).filter(Boolean);
  const pl=c.duracion_meses||c.plazo_meses||12;
  return `<div class="oferta">
    <div class="o-tae">${c.tae!=null&&c.tae!==''?nf.format(c.tae)+'<small>% TAE</small>':'—'}</div>
    <div class="o-main" data-c="condiciones" data-id="${esc(c._id)}" tabindex="0">
      <div class="o-nom">${esc(e.nombre||p.entidad_id||'')} <span>${esc(p.nombre||'')}</span></div>
      <div class="o-meta">${esc(meta.join(' · '))}</div>
      ${reqs?`<div class="o-reqs">${reqs}</div>`:''}
      ${c.condicion_posterior?`<div class="o-meta">Al terminar: ${esc(String(c.condicion_posterior).slice(0,90))}</div>`:''}
    </div>
    <div class="o-side">
      <button class="btn sm pri" data-calc="${n(c.tae)}|${n(pl)}|${esc((e.nombre||'')+' '+(p.nombre||''))}">Calcular</button>
      ${ver}${limiteAviso(c.fecha_limite_contratacion)}
      ${c.fuente_url?`<a href="${esc(c.fuente_url)}" target="_blank" rel="noopener">fuente</a>`:''}
    </div></div>`;
}
function vistaOfertas(cat){
  const ahorro=cat==='cuenta_ahorro';
  const ult=[...DATA.revisiones].sort((a,b)=>(a.fecha||'')<(b.fecha||'')?1:-1)[0];
  const dRev=ult?dias(ult.fecha):null;
  const todas=ofertas([cat]);
  let cu=todas;
  if(filtro==='simples') cu=cu.filter(o=>o.c.req_nomina!=='sí'&&o.c.req_tarjeta!=='sí'&&o.c.req_recibos!=='sí');
  if(filtro==='comprobadas') cu=cu.filter(o=>o.c.estado_verificacion==='verificado');
  const vigCat=todas.map(o=>o.c);
  const nver=vigCat.filter(c=>c.estado_verificacion==='verificado').length;
  const caducan=vigCat.filter(c=>{const d=dias(c.fecha_limite_contratacion);return d!=null&&d>=0&&d<=14});
  const seg=[['todas','Todas'],['simples','Sin nómina ni tarjeta'],['comprobadas','Comprobadas']]
    .map(([v,l])=>`<button data-f="${v}" aria-pressed="${filtro===v}">${l}</button>`).join('');
  const dep=ofertas(['deposito']);
  const plazos=[...new Set(dep.map(o=>n(o.c.plazo_meses)))].sort((a,b)=>a-b);
  const cab=`
  <div class="grid-k">
    <div class="k"><span class="n">Última revisión</span><span class="v">${ult?fdate(ult.fecha):'—'}</span><span class="n">${dRev===0?'hoy mismo':dRev!=null?'hace '+(-dRev)+' días':'automática cada mañana'}</span></div>
    <div class="k"><span class="n">${ahorro?'Cuentas de ahorro':'Cuentas remuneradas'}</span><span class="v">${todas.length}</span><span class="n">${nver} comprobadas de ${todas.length}</span></div>
    <div class="k ${caducan.length?'mag':''}"><span class="n">Caducan en 14 días</span><span class="v">${caducan.length}</span><span class="n">plazo para poder abrirlas</span></div>
  </div>`;
  const expl=ahorro
    ? `<p class="note">Las cuentas de ahorro solo guardan dinero: sin tarjeta, sin Bizum y sin recibos. Para gastarlo lo pasas a tu cuenta corriente, lo que tarda de un rato a un par de días. Muchas pagan un tipo estable sin requisitos, pero también hay promociones de bienvenida: las tienes separadas abajo, así que si un día hay una que aprovechar, la verás. Mira siempre de qué país es el fondo de garantía.</p>`
    : `<p class="note">Cuentas corrientes que pagan intereses: puedes tener ahí tarjeta, Bizum y recibos, y el dinero sale al instante. Las mejores TAE son promociones para nuevos clientes y caducan, así que fíjate en la fecha límite y en a cuánto bajan después.</p>`;
  const esPromo=c=>c.tipo_tasa==='promocional'||n(c.duracion_meses)>0||!!c.fecha_limite_contratacion;
  const conP=cu.filter(o=>esPromo(o.c)), sinP=cu.filter(o=>!esPromo(o.c));
  const bloque=(tit,sub,arr)=>arr.length?`<div class="plazo">${tit} <span style="text-transform:none;letter-spacing:0">· ${sub}</span></div>`+arr.map(o=>ofertaRow(o,false)).join(''):'';
  const lista=`<div class="group-title"><h2>${ahorro?'Cuentas de ahorro':'Cuentas remuneradas'}</h2><div class="seg">${seg}</div></div>
  <section class="col">${cu.length
    ?bloque('Con promoción','mejor TAE, pero caduca y hay que moverse',conP)+bloque('Sin promoción','paga menos, pero el tipo no tiene fecha de caducidad',sinP)
    :`<div class="empty">${todas.length?'Ninguna cumple ese filtro.':'Todavía no hay ninguna guardada. Las ofertas se cargan desde la web.'}</div>`}</section>`;
  if(ahorro) return cab+expl+lista;
  return cab+expl+lista+`
  <details class="col"><summary><div class="t"><h3><span class="chev">▸</span> Depósitos a plazo<span class="count">${dep.length}</span></h3><span class="d">Para dinero que no vayas a tocar.</span></div></summary>
    ${dep.length?plazos.map(pl=>`<div class="plazo">${pl?pl+' meses':'plazo sin indicar'}</div>`+dep.filter(o=>n(o.c.plazo_meses)===pl).map(o=>ofertaRow(o,true)).join('')).join(''):'<div class="empty">Sin depósitos guardados.</div>'}</details>
  <details class="col"><summary><div class="t"><h3><span class="chev">▸</span> Qué ha cambiado<span class="count">${DATA.cambios.length}</span></h3><span class="d">Historial de las revisiones diarias.</span></div></summary>
    <div style="padding:12px">${table('revisiones',true)}${table('cambios')}</div></details>
  <details class="col"><summary><div class="t"><h3><span class="chev">▸</span> Datos en bruto</h3><span class="d">Entidades, productos, condiciones, deuda y oro.</span></div></summary>
    <div style="padding:12px">${table('entidades')}${table('productos')}${table('condiciones')}${table('subastas_letras')}${table('emisiones_deuda')}${table('precios')}</div></details>`;
}

/* ===== CALCULADORA ===== */
function calcOut(){
  const p=proyeccion(CALC.imp,CALC.mes,CALC.tae,CALC.meses);
  const r=resumenProy(p);
  const ini=resumenProy(proyeccion(CALC.imp,0,CALC.tae,CALC.meses));
  const men=resumenProy(proyeccion(0,CALC.mes,CALC.tae,CALC.meses));
  const aportMes=r.aportado-n(CALC.imp);
  const ms=Math.max(1,Math.round(CALC.meses)||1);
  const pMio=r.saldo?r.aportado/r.saldo*100:100, pBen=Math.max(0,100-pMio);
  const hoyIni=today(); PROY.calc={p,ini:hoyIni};
  return `
  <div class="hero">
    <div class="lbl">Neto total al finalizar</div>
    <div class="big">${eur(r.saldo)}</div>
    <div class="sub">${ms===1?'1 mes':ms+' meses'} al ${pct(CALC.tae)} · ${eur(r.aportado)} tuyos más ${eur(r.neto)} de beneficio · ${eur(r.neto/ms)} netos al mes</div>
    <div class="compo" role="img" aria-label="Tu dinero ${nf.format(pMio)} %, beneficio ${nf.format(pBen)} %"><i class="mio" style="width:${pMio.toFixed(2)}%"></i><i class="ben" style="width:${pBen.toFixed(2)}%"></i></div>
  </div>
  <div class="ledgers">
    <div class="ledger"><h4>Tu dinero</h4>
      <div class="row"><span>Dinero inicial</span><span class="v">${eur(CALC.imp)}</span></div>
      <div class="row"><span>Metido mes a mes${CALC.mes?` <span style="color:var(--muted)">(${eur(CALC.mes)} × ${ms})</span>`:''}</span><span class="v">${eur(aportMes)}</span></div>
      <div class="row tot"><span>Total que pones tú</span><span class="v">${eur(r.aportado)}</span></div>
    </div>
    <div class="ledger"><h4>Beneficio</h4>
      <div class="row"><span>Beneficio bruto</span><span class="v">${eur(r.bruto)}</span></div>
      <div class="row"><span>Impuestos (19 %)</span><span class="v neg">−${eur(r.imp)}</span></div>
      <div class="row tot destacada"><span>Beneficio neto</span><span class="v">${eur(r.neto)}</span></div>
      <div class="row sub"><span>del dinero inicial</span><span class="v">${eur(ini.neto)}</span></div>
      <div class="row sub"><span>de lo que metes cada mes</span><span class="v">${eur(men.neto)}</span></div>
    </div>
  </div>
  <div class="prog-read" id="read-calc">${progRead(p,p.length-1,hoyIni)}</div>
  ${chartLinea(p,null,hoyIni,'calc')}`;
}

/* ===== MIS CUENTAS ===== */
function mejorOferta(){
  return ofertas(['cuenta_remunerada','cuenta_ahorro']).filter(o=>o.c.req_nomina!=='sí'&&o.c.req_tarjeta!=='sí'&&o.c.req_recibos!=='sí')[0];
}
function normPos(r,kind){
  if(kind==='mis_depositos') return {nom:r.entidad||r._id,tae:n(r.tae),saldo:n(r.importe),ap:n(r.aportacion_mensual),
    ini:r.fecha_inicio||today(),fin:r.fecha_vencimiento,tope:null,post:null,
    capLbl:'Al contratarlo',finLbl:'vence el',finTxt:'vence',cosa:'depósito'};
  return {nom:r.entidad||r.nombre||r._id,tae:n(r.tae),saldo:n(r.saldo_actual),ap:n(r.aportacion_mensual),
    ini:r.fecha_apertura||r.fecha_saldo||today(),fin:r.fin_promocion,tope:r.limite_remunerado,post:r.tae_posterior,
    capLbl:'Al abrir la cuenta',finLbl:'la promoción acaba el',finTxt:'acaba',cosa:'cuenta'};
}
function cuentaItem(r,kind){
  const q=normPos(r,kind), d=dias(q.fin);
  return `<div class="cuenta-item" data-open="${esc(kind+':'+r._id)}" tabindex="0" role="button">
    <div class="ci-main"><span class="ci-nom">${esc(q.nom)}</span>
      <span class="ci-sub">${eur(q.saldo)}${q.ap?' · +'+eur(q.ap)+' cada mes':''}${q.fin?' · '+q.finTxt+' el '+fdate(q.fin):''}</span></div>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="ci-tae">${pct(q.tae)}</span>${d!=null?diasPill(d):''}<span class="ci-go">›</span></div></div>`;
}
function vistaCuenta(r,kind){
  const q=normPos(r,kind);
  const simple=kind==='mis_depositos'&&r.frecuencia_intereses==='al_vencimiento';
  const iniF=q.ini, finF=q.fin||addMeses(iniF,12);
  const totalM=Math.max(1,mesesEntre(iniF,finF)||12);
  const pasados=Math.max(0,Math.min(totalM,mesesEntre(iniF,today())));
  const saldoIni=Math.max(0,q.saldo-q.ap*pasados);
  const p=proyeccion(saldoIni,q.ap,q.tae,totalM,q.tope,simple);
  const idc=esc(kind+'-'+r._id);
  PROY[idc]={p,ini:iniF};
  const res=resumenProy(p);
  const yaGan=pasados>0?p[Math.min(pasados,p.length)-1].neto:0;
  const avance=res.neto?Math.min(100,yaGan/res.neto*100):0;
  const d=dias(q.fin), mejor=mejorOferta(), alerta=d!=null&&d<=30;
  const pMio=res.saldo?res.aportado/res.saldo*100:100, pBen=Math.max(0,100-pMio);
  const mv=DATA.movimientos.filter(m=>m.posicion_ref===r._id);
  const rb=mv.filter(m=>m.tipo==='interes_bruto').reduce((a,m)=>a+n(m.importe),0);
  const rr=mv.filter(m=>m.tipo==='retencion').reduce((a,m)=>a+n(m.importe),0);
  return `
  <div class="volver">
    <button class="btn" data-back="1">‹ Ir atrás</button>
    <div style="display:flex;gap:8px;align-items:center">${d!=null?diasPill(d):''}<button class="btn" data-c="${kind}" data-id="${esc(r._id)}">Editar ${q.cosa}</button></div>
  </div>
  ${alerta?`<p class="note aviso"><strong>Toca moverse.</strong> ${d<0?'Ya ha terminado':'Quedan '+d+' días'}${q.post?`, y pasarás al ${pct(q.post)}`:''}. ${kind==='mis_depositos'?'Decide si lo renuevas o te llevas el dinero a otra oferta.':'Busca otra oferta y mueve el dinero.'}${mejor?` La mejor cuenta ahora: <strong>${esc((mejor.e.nombre||'')+' '+(mejor.p.nombre||''))}</strong> al ${pct(mejor.c.tae)}.`:''}</p>`:''}
  <section class="col">
    <div class="hd"><div class="t"><h3>${esc(q.nom)} <span style="color:var(--muted);font-weight:500;font-size:.82rem">${q.cosa}</span></h3>
      <span class="d">${pct(q.tae)}${q.ap?' · metes '+eur(q.ap)+' cada mes':''} · desde ${fdate(iniF)} hasta ${fdate(finF)}${simple?' · intereses al vencimiento':''}</span></div></div>
    <div class="avance">
      <div class="lbl">Ya llevas ganado</div>
      <div class="big">${eur(yaGan)}</div>
      <div class="de">de los ${eur(res.neto)} previstos${pasados?' · '+pasados+' '+(pasados===1?'mes':'meses')+' de '+totalM:' · aún no ha pasado el primer mes'}${rb?' · intereses realmente cobrados: '+eur(rb-rr):''}</div>
      <div class="compo" role="img" aria-label="Llevas el ${nf.format(avance)} % de lo previsto"><i class="ben" style="width:${avance.toFixed(2)}%"></i></div>
    </div>
    <div class="hero">
      <div class="lbl">Neto total al ${q.finTxt==='vence'?'vencimiento':'acabar'}</div>
      <div class="big">${eur(res.saldo)}</div>
      <div class="sub">${totalM} meses al ${pct(q.tae)} · ${eur(res.aportado)} tuyos más ${eur(res.neto)} de beneficio · ${eur(res.neto/totalM)} netos al mes</div>
      <div class="compo" role="img" aria-label="Tu dinero ${nf.format(pMio)} %, beneficio ${nf.format(pBen)} %"><i class="mio" style="width:${pMio.toFixed(2)}%"></i><i class="ben" style="width:${pBen.toFixed(2)}%"></i></div>
    </div>
    <div class="ledgers">
      <div class="ledger"><h4>Tu dinero</h4>
        <div class="row"><span>${q.capLbl}</span><span class="v">${eur(saldoIni)}</span></div>
        ${q.ap?`<div class="row"><span>Metido mes a mes <span style="color:var(--muted)">(${eur(q.ap)} × ${totalM})</span></span><span class="v">${eur(res.aportado-saldoIni)}</span></div>`:''}
        <div class="row tot"><span>Total que pones tú</span><span class="v">${eur(res.aportado)}</span></div>
        <div class="row sub"><span>hoy tienes apuntado</span><span class="v">${eur(q.saldo)}</span></div>
      </div>
      <div class="ledger"><h4>Beneficio previsto</h4>
        <div class="row"><span>Beneficio bruto</span><span class="v">${eur(res.bruto)}</span></div>
        <div class="row"><span>Impuestos (19 %)</span><span class="v neg">−${eur(res.imp)}</span></div>
        <div class="row tot destacada"><span>Beneficio neto</span><span class="v">${eur(res.neto)}</span></div>
        ${q.tope?`<div class="row sub"><span>solo remunera hasta</span><span class="v">${eur(q.tope)}</span></div>`:''}
        ${q.post?`<div class="row sub"><span>al acabar pasa al</span><span class="v">${pct(q.post)}</span></div>`:''}
      </div>
    </div>
    <div class="prog-read" id="read-${idc}">${progRead(p,Math.max(0,pasados-1),iniF)}</div>
    ${chartLinea(p,pasados,iniF,idc)}
    <div style="padding:0 15px 12px;color:var(--muted);font-size:.79rem">Pasa el dedo o el ratón por el gráfico para ver cada mes.${q.ap?' El dinero de partida se calcula a partir de lo que tienes hoy menos tus aportaciones, así que si has metido cantidades distintas, corrígelo en «Editar '+q.cosa+'».':''}</div>
  </section>`;
}
function vistaCuentas(){
  const cu=DATA.mis_cuentas;
  if(cuentaSel){
    const i=cuentaSel.indexOf(':'), kind=i>0?cuentaSel.slice(0,i):'mis_cuentas', rid=i>0?cuentaSel.slice(i+1):cuentaSel;
    const r=(DATA[kind]||[]).find(x=>x._id===rid);
    if(r) return vistaCuenta(r,kind);
    cuentaSel=null;
  }
  const dep=DATA.mis_depositos.filter(r=>r.estado!=='vencido'&&r.estado!=='cancelado');
  let total=0,netoMes=0,baseTae=0;
  cu.forEach(r=>{const base=r.limite_remunerado?Math.min(n(r.saldo_actual),n(r.limite_remunerado)):n(r.saldo_actual);
    total+=n(r.saldo_actual); netoMes+=base*n(r.tae)/100/12*(1-RET); baseTae+=base*n(r.tae)});
  dep.forEach(r=>{total+=n(r.importe); netoMes+=n(r.importe)*n(r.tae)/100/12*(1-RET); baseTae+=n(r.importe)*n(r.tae)});
  const baseSum=cu.reduce((a,r)=>a+(r.limite_remunerado?Math.min(n(r.saldo_actual),n(r.limite_remunerado)):n(r.saldo_actual)),0)+dep.reduce((a,r)=>a+n(r.importe),0);
  const taeMedia=baseSum?baseTae/baseSum:0;
  const fechas=[...cu.map(r=>({f:r.fin_promocion,q:r.entidad||r.nombre})),...dep.map(r=>({f:r.fecha_vencimiento,q:r.entidad}))]
    .filter(x=>x.f&&dias(x.f)!=null).sort((a,b)=>a.f<b.f?-1:1);
  const prox=fechas.find(x=>dias(x.f)>=0);
  const qa=canWrite?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
    <button class="btn pri" data-add="mis_cuentas">+ Cuenta</button>
    <button class="btn" data-add="mis_depositos">+ Depósito</button>
    <button class="btn" data-add="movimientos">+ Movimiento</button></div>`:'';
  return `
  <div class="grid-k">
    <div class="k"><span class="n">Dinero ahorrado</span><span class="v">${eur(total)}</span><span class="n">${cu.length+dep.length} sitios</span></div>
    <div class="k"><span class="n">Gano al mes (neto)</span><span class="v">${eur(netoMes)}</span><span class="n">${eur(netoMes*12)} al año</span></div>
    <div class="k"><span class="n">TAE media</span><span class="v">${pct(taeMedia)}</span><span class="n">ponderada por dinero</span></div>
    <div class="k ${prox&&dias(prox.f)<=30?'mag':''}"><span class="n">Próximo vencimiento</span><span class="v">${prox?dias(prox.f)+' d':'—'}</span><span class="n">${prox?esc(prox.q||'')+' · '+fdate(prox.f):'nada apuntado'}</span></div>
  </div>
  ${qa}
  ${cu.length?`<section class="col"><div class="hd"><div class="t"><h3>Cuentas<span class="count">${cu.length}</span></h3><span class="d">Pincha una para ver su ficha, su cálculo y su progreso.</span></div></div>${cu.map(r=>cuentaItem(r,'mis_cuentas')).join('')}</section>`
  :`<section class="col"><div class="empty">Añade tu primera cuenta con <strong>+ Cuenta</strong>: banco, dinero, lo que metes cada mes, TAE y cuándo acaba la promoción. Con eso te dibujo cómo crece y te aviso un mes antes de que termine.</div></section>`}
  ${dep.length?`<section class="col"><div class="hd"><div class="t"><h3>Depósitos<span class="count">${dep.length}</span></h3><span class="d">Pincha uno para ver su ficha y su progreso.</span></div></div>${dep.map(r=>cuentaItem(r,'mis_depositos')).join('')}</section>`:''}
  <details class="col"><summary><div class="t"><h3><span class="chev">▸</span> Otros registros</h3><span class="d">Movimientos, avisos propios, deuda pública, oro y productos en estudio.</span></div></summary>
    <div style="padding:12px">${table('movimientos')}${table('vencimientos')}${table('mis_depositos')}${table('mis_deuda')}${table('mis_oro')}${table('en_estudio')}</div></details>`;
}

/* ===== TABLAS GENÉRICAS ===== */
function table(cid,open){
  const C=COLS[cid], rows=DATA[cid];
  const fs=C.show.map(k=>C.f.find(f=>f.k===k)).filter(Boolean);
  const cell=(f,v)=>{
    const t=f.t.trim();
    if(v==null||v==='') return {h:'<span style="color:var(--muted)">—</span>',num:false};
    if(t==='e') return {h:eur(v),num:true};
    if(t==='p') return {h:pct(v),num:true};
    if(t==='n') return {h:esc(nf.format(+v)),num:true};
    if(t==='d') return {h:fdate(v),num:false};
    if(t==='u') return {h:`<a href="${esc(v)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">enlace</a>`,num:false};
    if(f.k==='estado_verificacion'){const c=v==='verificado'?'verif':v==='discrepancia'?'disc':'pend';return {h:`<span class="pill ${c}">${esc(v)}</span>`,num:false}}
    if(t==='s') return {h:`<span class="pill">${esc(v)}</span>`,num:false};
    const s=String(v); return {h:esc(s.length>60?s.slice(0,57)+'…':s),num:false};
  };
  const body=rows.length?`<div class="tbl"><table><thead><tr>${fs.map(f=>`<th${'enp'.includes(f.t.trim())?' style="text-align:right"':''}>${esc(f.l)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr data-c="${cid}" data-id="${esc(r._id)}" tabindex="0" style="cursor:pointer">${fs.map(f=>{const x=cell(f,r[f.k]);return `<td class="${x.num?'num':''}">${x.h}</td>`}).join('')}</tr>`).join('')
  }</tbody></table></div>`:`<div class="empty">Sin registros.${canWrite&&SIMPLE[cid]?' Pulsa «Añadir».':''}</div>`;
  return `<details class="col"${open?' open':''}><summary><div class="t"><h3><span class="chev">▸</span> ${esc(C.label)}<span class="count">${rows.length}</span></h3><span class="d">${esc(C.desc)}</span></div>${canWrite&&SIMPLE[cid]?`<button class="btn sm" data-add="${cid}">Añadir</button>`:''}</summary>${body}</details>`;
}

/* ===== RENDER ===== */
function render(){
  $('#tabs').innerHTML=GRUPOS.map(g=>`<button role="tab" aria-selected="${g.id===tab}" data-t="${g.id}">${g.label}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;try{history.replaceState(null,'','#'+tab)}catch(e){}render()});
  $('#view').innerHTML=CAT[tab]?vistaOfertas(CAT[tab]):tab==='calculadora'?vistaCalc():vistaCuentas();
  $('#view').querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();openEditor(b.dataset.add,null)});
  $('#view').querySelectorAll('[data-c][data-id]').forEach(el=>{
    const go=e=>{e.stopPropagation();openEditor(el.dataset.c,DATA[el.dataset.c].find(r=>r._id===el.dataset.id))};
    el.onclick=go; el.onkeydown=e=>{if(e.key==='Enter')go(e)};
  });
  $('#view').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;render()});
  $('#view').querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{
    const [t,m,nom]=b.dataset.calc.split('|');
    CALC.tae=+t||0; CALC.meses=+m||12; CALC.origen=nom||'';
    tab='calculadora'; try{history.replaceState(null,'','#calculadora')}catch(e){} render();
  });
  $('#view').querySelectorAll('[data-open]').forEach(el=>{
    const go=e=>{if(e)e.stopPropagation();cuentaSel=el.dataset.open;render();try{window.scrollTo(0,0)}catch(x){}};
    el.onclick=go; el.onkeydown=e=>{if(e.key==='Enter')go(e)};
  });
  $('#view').querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{cuentaSel=null;render()});
  $('#view').querySelectorAll('svg[id^="chart-"]').forEach(svg=>{
    const id=svg.id.slice(6), box=document.getElementById('read-'+id), P=PROY[id];
    if(!box||!P) return;
    svg.querySelectorAll('.bar').forEach(g=>{
      const show=()=>{box.innerHTML=progRead(P.p,+g.dataset.i,P.ini)};
      g.onmouseenter=show; g.onclick=show;
    });
  });
  if($('#cImp')){
    const upd=()=>{CALC.imp=+$('#cImp').value||0;CALC.mes=+$('#cMes').value||0;CALC.tae=+$('#cTae').value||0;CALC.meses=+$('#cMeses').value||0;$('#calcBox').innerHTML=calcOut()};
    ['cImp','cMes','cTae','cMeses'].forEach(k=>$('#'+k).oninput=upd);
    const sel=$('#cSel');
    if(sel) sel.onchange=()=>{if(!sel.value)return;const[t,m,nom]=sel.value.split('|');$('#cTae').value=t;$('#cMeses').value=m;CALC.origen=nom;upd();render()};
  }
}
async function exportAll(){
  if(!dlApi) return;
  const out={exportado:new Date().toISOString(),app:'plan-y-control-de-ahorros',datos:{}};
  Object.keys(COLS).forEach(k=>out.datos[k]=DATA[k].map(({_id,...r})=>r));
  try{await dlApi.save({filename:'plan-ahorros-'+today()+'.json',data:JSON.stringify(out,null,2)})}catch(e){}
}
async function importarCopia(file){
  const msg=$('#impMsg');
  const di=t=>{if(msg)msg.textContent=t};
  if(!db||!canWrite){di('No se puede escribir en esta vista.');return}
  let obj;
  try{obj=JSON.parse(await file.text())}catch(e){di('Ese archivo no es una copia válida.');return}
  const datos=obj&&obj.datos?obj.datos:obj;
  if(!datos||typeof datos!=='object'){di('La copia no tiene datos reconocibles.');return}
  let ok=0,mal=0,total=0;
  Object.keys(COLS).forEach(c=>{if(Array.isArray(datos[c]))total+=datos[c].length});
  if(!total){di('La copia está vacía.');return}
  di('Importando 0 de '+total+'…');
  for(const c of Object.keys(COLS)){
    const arr=datos[c];
    if(!Array.isArray(arr)) continue;
    for(const r of arr){
      const id=r&&r[COLS[c].key];
      if(!id){mal++;continue}
      const {_id,...limpio}=r;
      try{await db.collection(c).doc(String(id)).set(limpio); ok++}
      catch(e){mal++}
      if((ok+mal)%10===0) di('Importando '+(ok+mal)+' de '+total+'…');
    }
  }
  di(ok+' registros importados'+(mal?', '+mal+' con error':'')+'.');
  setTimeout(()=>di(''),8000);
}

/* ===== EDITOR ===== */
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)}
function openEditor(cid,row){
  if(!cid||!COLS[cid]) return;
  const C=COLS[cid], ro=!canWrite, S=SIMPLE[cid]||{}, D=row?{}:(S.def?S.def():{});
  const inp=f=>{
    const t=f.t.trim(), v=row?(row[f.k]??''):(D[f.k]??''), id=`fld-${cid}-${f.k}`, dis=ro||(row&&f.k===C.key)?'disabled':'';
    const help=f.o&&!Array.isArray(f.o)&&f.o.h?`<span class="h">${esc(f.o.h)}</span>`:'';
    let ctl;
    if(t==='s') ctl=`<select id="${id}" name="${f.k}" ${dis}><option value=""></option>${f.o.map(o=>`<option ${String(v)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(t==='l') ctl=`<textarea id="${id}" name="${f.k}" ${dis}>${esc(v)}</textarea>`;
    else ctl=`<input id="${id}" name="${f.k}" ${dis} type="${t==='d'?'date':t==='u'?'url':'enp'.includes(t)?'number':'text'}" ${'enp'.includes(t)?'step="any" inputmode="decimal"':''} value="${esc(v)}">`;
    return `<label class="f ${t==='l'?'full':''}">${esc(f.l)}${t==='p'?' (%)':t==='e'?' (€)':''}${ctl}${help}</label>`;
  };
  $('#editor').innerHTML=`<div class="overlay" id="ov"><form class="panel" id="frm" novalidate>
    <div><div class="eyebrow">${esc(C.label)}</div><h2>${row?(S.edit||'Editar'):(S.nuevo||'Nuevo registro')}</h2></div>
    ${cid==='condiciones'&&row?'<p class="note">Si las condiciones han cambiado, ciérralas con «vigente hasta» y crea una versión nueva.</p>':''}
    ${S.quick?`<div class="fields">${C.f.filter(f=>S.quick.includes(f.k)).map(inp).join('')}</div>
    <details class="more"><summary>Más campos (opcional)</summary><div class="fields">${C.f.filter(f=>!S.quick.includes(f.k)).map(inp).join('')}</div></details>`
    :`<div class="fields">${C.f.map(inp).join('')}</div>`}
    <div class="actions">
      <div style="display:flex;gap:8px">${!ro?`<button type="submit" class="btn pri">Guardar</button>`:''}<button type="button" class="btn" id="cancel">Cerrar</button></div>
      ${row&&!ro?`<span id="delbox"><button type="button" class="btn danger" id="del">Eliminar</button></span>`:''}
    </div><div class="msg" id="msg"></div></form></div>`;
  const close=()=>{$('#editor').innerHTML=''};
  $('#cancel').onclick=close;
  $('#ov').onclick=e=>{if(e.target.id==='ov')close()};
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
  const del=$('#del');
  if(del) del.onclick=()=>{
    $('#delbox').innerHTML=`<span style="font-size:.85rem">¿Seguro?</span> <button type="button" class="btn danger" id="delok">Sí, eliminar</button>`;
    $('#delok').onclick=async()=>{try{await db.collection(cid).doc(row._id).delete();close()}catch(e){$('#msg').textContent='No se pudo eliminar: '+(e.message||e.code)}};
  };
  $('#frm').onsubmit=async e=>{
    e.preventDefault(); if(ro) return;
    const o={};
    C.f.forEach(f=>{const el=$('#frm').elements[f.k]; if(!el) return; const v=el.value.trim(), t=f.t.trim();
      if(v===''){o[f.k]=null;return}
      if('enp'.includes(t)){const x=parseFloat(v.replace(',','.')); o[f.k]=isNaN(x)?null:x} else o[f.k]=v});
    let id=row?row._id:(o[C.key]||'');
    if(!id){const base=o.entidad||o.nombre||o.producto_id||o.emisor||o.instrumento||o.tipo||cid; id=slug(base+'-'+(o.fecha||o.fecha_apertura||o.fecha_inicio||today()))+'-'+Math.random().toString(36).slice(2,5)}
    id=slug(id); if(!id){$('#msg').textContent='Falta el nombre del banco.';return}
    if(!row&&DATA[cid].some(r=>r._id===id)){$('#msg').textContent='Ya existe un registro con ese ID.';return}
    o[C.key]=id; o._actualizado=new Date().toISOString(); o._origen=COLS[cid].grupo==='mio'?'manual':'investigado';
    try{await db.collection(cid).doc(id).set(o); close()}
    catch(err){$('#msg').textContent=err.code==='quota_exceeded'?'La base de datos está llena.':'No se pudo guardar: '+(err.message||err.code)}
  };
}

/* ===== CONEXIÓN ===== */
function setState(ok,txt){$('#dbdot').className='dot '+(ok?'ok':'err');$('#dbstate').textContent=txt}
render();
(async()=>{
  const c=window.claude;
  if(!c||!c.use){setState(false,'Sin base de datos');return}
  db=await c.use('db');
  if(!db){setState(false,'Sin base de datos');render();return}
  const user=await c.use('user');
  canWrite=user?(await user.can('data.write'))!==false:true;
  setState(true,'Guardado en este dispositivo');
  let pending=Object.keys(COLS).length;
  Object.keys(COLS).forEach(cid=>{
    db.collection(cid).onSnapshot(snap=>{
      DATA[cid]=snap.docs.map(d=>({...d.data(),_id:d.id}));
      const o=COLS[cid].show.find(k=>/fecha|vigente_desde/.test(k));
      if(o) DATA[cid].sort((a,b)=>String(b[o]||'').localeCompare(String(a[o]||'')));
      if(pending>0) pending--;
      if(pending===0) render();
    },e=>setState(false,'Error de conexión ('+e.code+')'));
  });
  dlApi=await c.use('downloads');
  if(dlApi){const b=$('#btnExport');b.hidden=false;b.onclick=exportAll}
  const fi=$('#fileImport'), bi=$('#btnImport');
  if(fi&&bi){
    bi.onclick=()=>{$('#impMsg').textContent='Los registros con el mismo ID se sustituyen.';fi.click()};
    fi.onchange=()=>{const f=fi.files&&fi.files[0]; if(f) importarCopia(f); fi.value=''};
  }
  render();
})();
</script>
